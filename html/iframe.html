<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <title>Document</title>

            * {
                margin: 0;

            li {
                list-style: none;

                text-decoration: none;
                color: #fff;
            }
            #wrap {
                width: 1000px;
                margin: 0 auto;
                background-color: gray;
            }
            ul {
                height: 80px;
                display: flex;
            }
            li {
                width: 20%;
                font-size: 20px;
                font-weight: bold;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            li:nth-child(1) {
                background-color: red;
            }
            li:nth-child(2) {
                background-color: rgb(255, 149, 0);
            }
            li:nth-child(4) {
                background-color: rgb(0, 255, 42);
            }
            li:nth-child(4) {
                background-color: rgb(0, 8, 255);
            }
            li:nth-child(5) {

            }
            .iframe_inner {
                width: 100%;
                height: 600px;
                background-color: aquamarine;
            }
        </style>
    </head>
    <body>

            <div class="wrap"></h1>
                <ul>
